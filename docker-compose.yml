# =========================================================
# Оркестрация Avito Parser + VK Publisher
# Сервис webui; Caddy включается профилем domain при установке с доменом.
# =========================================================

services:
  webui:
    build: .
    container_name: avito_webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - HEADLESS_MODE=true
      - DB_PATH=data/avito.db
      - PHOTOS_DIR=data/photos
      - LOG_FILE=logs/avito_parser.log
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: python webui.py --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    container_name: avito_caddy
    profiles: ["domain"]
    restart: unless-stopped
    depends_on:
      - webui
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
